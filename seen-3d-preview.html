<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f1ef}model-viewer{width:100%;height:100%;--poster-color:#f1f1ef}#err{position:fixed;inset:auto 0 0;background:#fff9;color:#333;font:12px Arial;padding:6px;display:none}</style><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script></head><body><model-viewer id="m" camera-controls auto-rotate rotation-per-second="12deg" shadow-intensity="1" exposure="1" interaction-prompt="none"></model-viewer><div id="err">Could not load 3D model. Check the model file and network connection.</div><script>let f=new URLSearchParams(location.search).get('model')||'sunglasses.glb';let m=document.querySelector('#m');m.src=f;m.addEventListener('error',()=>document.querySelector('#err').style.display='block')</script></body></html>
