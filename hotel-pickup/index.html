<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Free hotel pick-up and return for your glasses in Hurghada.">
<title>Hotel pick-up booking | SEEN Eyewear</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#0b0b0b;--gray:#606060;--line:#E2E9ED;--sky:#5AC8FA;--bg:#F6F8F9}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Jost,"IBM Plex Sans Arabic",sans-serif;font-weight:300;color:var(--ink);background:#fff;line-height:1.5}
header{background:var(--bg);border-bottom:1px solid var(--line);padding:16px}
header a{text-decoration:none;color:var(--gray);font-size:14px}
main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:30px;font-weight:400;margin:0 0 8px}
.lead{color:var(--gray);margin:0 0 24px}
label{display:block;font-size:14px;margin:0 0 14px}
input,select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff}
.btn{display:block;width:100%;margin-top:8px;padding:14px;border-radius:999px;border:1px solid var(--sky);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}
.note{font-size:13px;color:var(--gray);margin-top:16px}
footer{border-top:1px solid var(--line);padding:20px 16px 28px;text-align:center;font-size:12px;color:var(--gray)}
footer a{color:var(--gray);margin:0 8px;text-decoration:none}
</style>
</head>
<body>
<header><a href="/">&larr; SEEN Eyewear</a></header>
<main>
<h1>Hotel pick-up booking</h1>
<p class="lead">Free pick-up and return from any hotel in Hurghada. No obligation to buy.</p>
<form id="hf">
<label>Name<input id="hn" required autocomplete="name"></label>
<label>Phone<input id="hp" type="tel" required autocomplete="tel"></label>
<label>Hotel name<input id="hh" required></label>
<label>Preferred day<input id="hd" type="date" required></label>
<label>Preferred time<select id="ht"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
<button class="btn" type="submit">Send booking on WhatsApp</button>
</form>
<p class="note">Our team confirms your time on WhatsApp.</p>
</main>
<footer>
<a href="https://www.instagram.com/seeneyewear.eg/" target="_blank" rel="noopener">Instagram</a>
<a href="https://www.facebook.com/seeneyewear.eg" target="_blank" rel="noopener">Facebook</a>
<a href="https://www.tiktok.com/@seeneyewear.eg" target="_blank" rel="noopener">TikTok</a>
<div style="margin-top:10px">&copy; 2026 SEEN Eyewear</div>
</footer>
<script>
document.getElementById('hf').addEventListener('submit',function(e){
e.preventDefault();
var m='Hotel pick-up booking%0AName: '+encodeURIComponent(document.getElementById('hn').value)+'%0APhone: '+encodeURIComponent(document.getElementById('hp').value)+'%0AHotel: '+encodeURIComponent(document.getElementById('hh').value)+'%0ADay: '+document.getElementById('hd').value+'%0ATime: '+document.getElementById('ht').value;
location.href='https://wa.me/201112299665?text='+m;
});
</script>
<script src="/site-nav.js" defer></script>
</body>
</html>
