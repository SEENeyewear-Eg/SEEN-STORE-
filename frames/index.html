<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find your frame | SEEN Eyewear</title>
<meta name="robots" content="index,follow">
<link rel="stylesheet" href="wheel.css">
</head>
<body>
<main class="wrap" style="min-height:100vh;display:grid;place-items:center;padding:72px 16px 120px">
  <div class="lens-stage" id="lensStage">
    <div class="ring"></div><div class="ring r2"></div>
    <div class="dial" id="frameWheel" role="group" aria-label="Frames"></div>
    <div class="dial" id="faceWheel" role="group" aria-label="Face shapes"></div>
    <div class="fit-face" id="fitFace" aria-hidden="true"></div>
    <div class="seg" id="kindSeg" role="radiogroup"></div>
    <div class="seg" id="genderSeg" role="radiogroup"></div>
    <div class="fit-name" id="fitName"></div>
    <p class="fit-note" id="fitNote">Pick a frame from the left wheel to try it on.</p>
  </div>
</main>
<script src="wheel.js"></script>
</body>
</html>
